---
name: Update Terraform Lock File
description: Update terraform lock file to include hashes for both platforms

inputs:
  app-id:
    description: Application ID
    required: true

  app-pem:
    description: Application private key
    required: true

runs:
  using: composite
  steps:
    - name: Generate token
      id: generate-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-pem }}

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
        ref: ${{ github.head_ref || github.ref_name }}
        repository: ${{ github.repository }}
        token: ${{ steps.generate-token.outputs.token }}

    - name: Setup terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

    - name: Update lock file for all platforms
      shell: bash
      run: |-
        find . -name ".terraform.lock.hcl" -print0 | while IFS= read -r -d '' lockfile; do
          dir=$(dirname "$lockfile")
          echo "Initialising $dir"
          terraform -chdir="$dir" init -backend=false -upgrade
          echo "Locking providers in $dir"
          terraform -chdir="$dir" providers lock \
            -platform=darwin_amd64 \
            -platform=linux_amd64
        done

    - name: Commit updated lock files
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: update terraform lock file for both platforms
        file_pattern: "**/.terraform.lock.hcl"
