---
name: Linting
description: Runs prek over the repo

inputs:
  ansible-roles-config:
    description: The ansible requirements.yml file
    default: missing

  pre-commit-config:
    description: The pre-commit config file of the current repo
    required: true

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        ref: ${{ github.ref }}
        repository: ${{ github.repository }}

    - name: Cache ansible & prek
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |-
          ~/.ansible
          ~/.cache/prek
        # yamllint disable-line rule:quoted-strings
        key: "\
          cache-\
          ${{ hashFiles(inputs.ansible-roles-config) }}-\
          ${{ hashFiles(inputs.pre-commit-config) }}\
          "
      if: inputs.ansible-roles-config != 'missing'

    - name: Cache prek
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/prek
        key: cache-${{ hashFiles(inputs.pre-commit-config) }}
      if: inputs.ansible-roles-config == 'missing'

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        activate-environment: true
        python-version: 3.14

    - name: Install ansible
      shell: bash
      run: uv pip install ansible
      if: inputs.ansible-roles-config != 'missing'

    - name: Install prek
      shell: bash
      run: uv pip install prek

    - name: Install ansible roles
      shell: bash
      run: >-
        uv run ansible-galaxy install -r ${{ inputs.ansible-roles-config }}
        --force
      if: inputs.ansible-roles-config != 'missing'

    - name: Set up terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

    - name: Run prek
      shell: bash
      run: uv run prek run --all-files --color always --verbose
